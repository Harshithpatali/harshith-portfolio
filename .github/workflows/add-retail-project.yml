name: Add Retail Forecasting Project

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-retail-project.yml'

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Update portfolio
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'index.html';

            const current = await github.rest.repos.getContent({
              owner,
              repo,
              path,
              ref: 'main'
            });

            if (Array.isArray(current.data)) {
              throw new Error('index.html was unexpectedly returned as a directory.');
            }

            const text = Buffer.from(current.data.content, 'base64').toString('utf8');

            if (text.includes("retail_demand_inventory")) {
              console.log('Retail project already present.');
              return;
            }

            const card = `      <div class="project-card" data-category="analytics" onclick="openProject('retail_demand_inventory')">
        <div class="project-header">
          <span class="project-num">11</span>
          <span class="project-category">Forecasting &amp; Optimization</span>
        </div>
        <div class="project-title">Retail Demand &amp; Inventory Optimization</div>
        <p class="project-desc">End-to-end retail forecasting and inventory decision system combining global machine learning, demand uncertainty, periodic-review optimization, simulation, and business-impact analysis.</p>
        <div class="project-metrics">
          <span class="metric">XGBoost</span><span class="metric">Time Series</span><span class="metric">(R,S) Policy</span>
        </div>
        <div class="chart-box"><canvas id="chart11"></canvas></div>
        <div class="project-links" onclick="event.stopPropagation()">
          <a href="https://github.com/Harshithpatali/retail-demand-inventory-optimization" target="_blank" class="project-link">GitHub</a>
          <a href="https://retail-demand-inventory-optimization-v1.streamlit.app/" target="_blank" class="project-link live">Live Demo ↗</a>
        </div>
      </div>\n\n`;

            const cardMarker = `      <div class="project-card" data-category="finance" onclick="openProject('qqq_transformer')">`;
            if (!text.includes(cardMarker)) {
              throw new Error('Project card insertion marker not found.');
            }

            let updated = text.replace(cardMarker, card + cardMarker);

            const chartMarker = "makeChart('chart10',[46,62,75,87,95,99]);";
            if (!updated.includes(chartMarker)) {
              throw new Error('Chart marker not found.');
            }

            updated = updated.replace(
              chartMarker,
              chartMarker + "\nmakeChart('chart11',[52,64,73,84,92,98]);"
            );

            const modalMarker = '  tcs_financial_agent:{';
            if (!updated.includes(modalMarker)) {
              throw new Error('Modal insertion marker not found.');
            }

            const modal = `  retail_demand_inventory:{
    badge:'Forecasting & Optimization',
    title:'Retail Demand & Inventory Optimization',
    sub:'End-to-end retail forecasting and inventory decision system using machine learning, demand uncertainty, and periodic-review optimization.',
    overview:'Built on the M5 retail dataset, the system models a hardware-conscious subset of 200 item-store series and 388K feature rows. The forecasting experiment compares strong baselines with XGBoost and LightGBM, while a cost-aware periodic-review (R,S) inventory layer is evaluated through held-out simulation.',
    features:['Time-Series Forecasting','Demand Uncertainty','Periodic-Review (R,S)','Inventory Simulation','Business Impact'],
    tech:['Python','XGBoost','LightGBM','Pandas','Scikit-Learn','FastAPI','Streamlit'],
    github:'https://github.com/Harshithpatali/retail-demand-inventory-optimization',
    live:'https://retail-demand-inventory-optimization-v1.streamlit.app/'
  },\n`;

            updated = updated.replace(modalMarker, modal + modalMarker);

            const encoded = Buffer.from(updated, 'utf8').toString('base64');

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'Add retail demand inventory project to portfolio',
              content: encoded,
              sha: current.data.sha,
              branch: 'main'
            });

            console.log('Retail forecasting project added successfully.');
